            - generic [ref=e109]: "مثال: «حَرَّرَ الْفَلَسْطِينِيُّونَ الْقُدْسَ» (الفاعل)، و«نُصِرَتْ فَلَسْطِينُ» (نائب الفاعل). أهلاً بك يا بني. بناءً على المحتوى المقدم، إليك الفرق بين الفاعل ونائب الفاعل بحسب ما ورد في النص: 1. **الفاعل:** * **تعريفه:** هو اسم مرفوع يأتي بعد الفعل، ويكون إما اسماً ظاهراً أو ضميراً. * **علامات رفعه:** يُرفع بالضمة في المفرد، وبالألف في المثنى، وبالواو في الجمع. * **موقعه:** هو من أنواع (المُسْنَدِ إِلَيْهِ)، أي الاسم المحكوم عليه. * **الشاهد من النص:** «حَرَّرَ الْفَلَسْطِينِيُّونَ الْقُدْسَ» (الفلسطينيون: فاعل مرفوع بالواو لأنه جمع). 2. **نائب الفاعل:** * **موقعه:** ورد في النص أنه نوع آخر من أنواع (المُسْنَدِ إِلَيْهِ)، أي أنه اسم محكوم عليه أيضاً. * **الشاهد من النص:** «نُصِرَتْ فَلَسْطِينُ» (فلسطينُ: نائب فاعل). **ملاحظة:** لم يتضمن المحتوى المتاح تفاصيل أو قواعد إضافية تبيّن شروط نائب الفاعل أو أحكامه وإعرابه الكامل مقارنة بالفاعل، سوى أنهما كلاهما يندرجان تحت باب (المسند إليه)."
