[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-text"
version = "0.1.0"
description = "Pure Arabic text helpers shared across services (no app imports)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
py-modules = ["arabic_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
